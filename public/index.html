<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JOSHVA - AI Guide to India</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #FF9933, #138808);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .container {
      width: 90%;
      max-width: 600px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      height: 90vh;
      max-height: 800px;
    }
    
    .header {
      background: linear-gradient(135deg, #FF9933, #138808);
      color: white;
      padding: 20px;
      text-align: center;
      border-radius: 15px 15px 0 0;
    }
    
    .header h1 { font-size: 28px; margin-bottom: 5px; }
    .header p { font-size: 14px; opacity: 0.9; }
    
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    
    .message {
      display: flex;
      margin-bottom: 10px;
      animation: slideIn 0.3s;
    }
    
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .message.user {
      justify-content: flex-end;
    }
    
    .bubble {
      max-width: 70%;
      padding: 12px 15px;
      border-radius: 15px;
      word-wrap: break-word;
      line-height: 1.4;
    }
    
    .message.user .bubble {
      background: #FF9933;
      color: white;
    }
    
    .message.bot .bubble {
      background: #f0f0f0;
      color: #333;
    }
    
    .welcome {
      text-align: center;
      color: #999;
      padding: 20px;
    }
    
    .welcome h2 { color: #FF9933; margin-bottom: 10px; }
    
    .buttons {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 15px;
    }
    
    .btn {
      background: #f0f0f0;
      border: 1px solid #ddd;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.3s;
    }
    
    .btn:hover {
      background: #FF9933;
      color: white;
      border-color: #FF9933;
    }
    
    .input-area {
      padding: 15px;
      border-top: 1px solid #ddd;
      display: flex;
      gap: 10px;
    }
    
    .input-area input {
      flex: 1;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 25px;
      font-size: 14px;
      outline: none;
    }
    
    .input-area input:focus {
      border-color: #FF9933;
      box-shadow: 0 0 5px rgba(255,153,51,0.3);
    }
    
    .input-area button {
      background: #FF9933;
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 25px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s;
    }
    
    .input-area button:hover {
      background: #138808;
      transform: translateY(-2px);
    }
    
    .input-area button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    .loading {
      color: #999;
      font-style: italic;
      padding: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🤖 JOSHVA</h1>
      <p>Your AI Guide to India</p>
    </div>
    
    <div class="messages" id="messages">
      <div class="welcome">
        <h2>Welcome! 👋</h2>
        <p>Ask me anything about India</p>
        <div class="buttons">
          <button class="btn" onclick="askAbout('geography')">🗺️ Geography</button>
          <button class="btn" onclick="askAbout('history')">📚 History</button>
          <button class="btn" onclick="askAbout('culture')">🎭 Culture</button>
          <button class="btn" onclick="askAbout('food')">🍛 Food</button>
          <button class="btn" onclick="askAbout('tourism')">✈️ Tourism</button>
          <button class="btn" onclick="askAbout('sports')">🏏 Sports</button>
          <button class="btn" onclick="askAbout('economy')">💼 Economy</button>
          <button class="btn" onclick="askAbout('people')">👥 People</button>
        </div>
      </div>
    </div>
    
    <div class="input-area">
      <input type="text" id="input" placeholder="Ask about India..." onkeypress="if(event.key==='Enter') send()">
      <button onclick="send()">Send</button>
    </div>
  </div>

  <script>
    const chatId = Math.random().toString();
    
    async function send() {
      const input = document.getElementById('input');
      const message = input.value.trim();
      
      if (!message) return;
      
      // Add user message
      addMessage(message, 'user');
      input.value = '';
      
      // Show loading
      const loading = document.createElement('div');
      loading.className = 'loading';
      loading.textContent = '⏳ Thinking...';
      document.getElementById('messages').appendChild(loading);
      
      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message, id: chatId })
        });
        
        const data = await res.json();
        loading.remove();
        addMessage(data.response, 'bot');
      } catch (error) {
        loading.remove();
        addMessage('Error! Check if server is running.', 'bot');
      }
    }
    
    function addMessage(text, role) {
      const div = document.createElement('div');
      div.className = 'message ' + role;
      div.innerHTML = '<div class="bubble">' + text + '</div>';
      document.getElementById('messages').appendChild(div);
      document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
    }
    
    function askAbout(topic) {
      document.getElementById('input').value = 'Tell me about ' + topic;
      send();
    }
  </script>
</body>
</html>
